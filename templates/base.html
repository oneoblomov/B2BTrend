<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}B2BTrend{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="notification-center">
    <button
      type="button"
      class="notification-fab"
      id="global-notification-toggle"
      aria-label="Bildirimler"
      aria-expanded="false"
      aria-controls="global-notification-panel"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" class="notification-fab__icon">
        <path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm8-6V11a8 8 0 1 0-16 0v5l-2 2v1h20v-1l-2-2Zm-2 1H6v-6a6 6 0 1 1 12 0v6Z" fill="currentColor"/>
      </svg>
      <span class="notification-fab__count" id="global-notification-count"></span>
    </button>
    <aside class="notification-panel" id="global-notification-panel" hidden>
      <div class="notification-panel__header">
        <div>
          <p>Bildirimler</p>
          <h3>Gecmis</h3>
        </div>
        <div class="notification-panel__actions">
          <button type="button" class="btn btn-compact" id="global-notification-clear">Gecmisi Temizle</button>
          <button type="button" class="btn btn-compact" id="global-notification-close">Kapat</button>
        </div>
      </div>
      <div class="notification-panel__list" id="global-notification-list"></div>
    </aside>
  </div>
  {% block content %}{% endblock %}
  <script src="/static/js/browser_storage.js"></script>
  <script src="/static/js/job_status.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
